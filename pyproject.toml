[project]
name = "sbom_enrichment"
version = "0.4.1"
description = "Helper tool for SBOM enrichment"
authors = [
    {name = "MAB",email = "support@commonplacerobotics.de"}
]
readme = "README.md"
requires-python = ">=3.9.2"
license = "MIT"

dependencies = [
	"requests (>= 2.0)",
	"pathlib (>= 1.0)",
	"license-expression (>= 30.4)",
	"pywin32 (>=312,<313) ; sys_platform == \"win32\""
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line-length = 160
